name: CI/CD

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (Install Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build
          path: vendor/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-build
          path: vendor/

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simulate staging deploy
        run: echo "Deploying ke environment staging..."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Step 1 - Pull kode terbaru
        run: echo "1. Menarik kode terbaru dari branch main..."

      - name: Step 2 - Install dependency production
        run: echo "2. Menjalankan composer install --no-dev --optimize-autoloader..."

      - name: Step 3 - Set maintenance mode
        run: echo "3. Mengaktifkan mode maintenance (php artisan down)..."

      - name: Step 4 - Jalankan migrasi database
        run: echo "4. Menjalankan php artisan migrate --force..."

      - name: Step 5 - Bersihkan dan cache ulang config
        run: echo "5. Menjalankan php artisan config:cache dan route:cache..."

      - name: Step 6 - Restart service
        run: echo "6. Merestart queue worker dan web server..."

      - name: Step 7 - Matikan maintenance mode
        run: echo "7. Menonaktifkan mode maintenance (php artisan up)..."
