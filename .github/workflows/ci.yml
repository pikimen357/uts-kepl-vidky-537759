name: CI/CD

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (Install Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build
          path: vendor/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-build
          path: vendor/

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simulate staging deploy
        run: echo "Deploying ke environment staging..."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Step 1 - Kunci pintu (maintenance mode)
        run: echo "1. Menjalankan php artisan down --retry=60..."

      - name: Step 2 - Ambil kode terbaru
        run: echo "2. Menjalankan git pull origin main..."

      - name: Step 3 - Pasang dependensi
        run: echo "3. Menjalankan composer install --no-dev --optimize-autoloader..."

      - name: Step 4 - Ubah skema basis data
        run: echo "4. Menjalankan php artisan migrate --force..."

      - name: Step 5 - Bangun ulang cache
        run: echo "5. Menjalankan php artisan config:cache, route:cache, view:cache..."

      - name: Step 6 - Muat ulang pekerja antrean
        run: echo "6. Menjalankan php artisan queue:restart..."

      - name: Step 7 - Buka pintu kembali
        run: echo "7. Menjalankan php artisan up..."
